<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1120" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',monospace">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',monospace; }
    .ttl { font-size:18px; font-weight:700; fill:#e2e8f0; }
    .sub { font-size:10px; fill:#64748b; }
    .nm  { font-size:12px; font-weight:600; fill:#ffffff; }
    .ds  { font-size:9px; fill:#94a3b8; }
    .tiny{ font-size:8px; fill:#64748b; }
    .lbl { font-size:10px; font-weight:600; fill:#22d3ee; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arw-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arw-v" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" class="ttl">公平仲裁器 (iSLIP + 增广 + 残余填充) — 方案图</text>
  <text x="30" y="58" class="sub">N 源 × M 目的 · 单拍出结果 · 双向 round-robin · 每拍极大匹配(无浪费调度) · 纯组合逻辑 + 指针寄存器</text>

  <!-- ===================== Inputs ===================== -->
  <rect x="40" y="90" width="250" height="62" rx="6" fill="#0f172a"/>
  <rect x="40" y="90" width="250" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="165" y="114" class="nm" text-anchor="middle">i_src_dest_req</text>
  <text x="165" y="130" class="ds" text-anchor="middle">[N-1:0][M-1:0] 源 n 请求目的 m</text>

  <rect x="310" y="90" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="310" y="90" width="180" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="114" class="nm" text-anchor="middle">i_src_bp</text>
  <text x="400" y="130" class="ds" text-anchor="middle">[N-1:0] 源反压</text>

  <rect x="510" y="90" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="510" y="90" width="180" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="114" class="nm" text-anchor="middle">i_dest_bp</text>
  <text x="600" y="130" class="ds" text-anchor="middle">[M-1:0] 目的反压</text>

  <rect x="710" y="90" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="710" y="90" width="180" height="62" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="800" y="114" class="nm" text-anchor="middle">clk / rst_n</text>
  <text x="800" y="130" class="ds" text-anchor="middle">时钟 / 异步复位(低有效)</text>

  <!-- input -> eff_req -->
  <path d="M 165 152 L 165 185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 400 152 L 400 185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 600 152 L 600 185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ===================== eff_req ===================== -->
  <rect x="40" y="185" width="760" height="56" rx="6" fill="#0f172a"/>
  <rect x="40" y="185" width="760" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="207" class="nm" text-anchor="middle">有效请求门控 (组合)</text>
  <text x="420" y="225" class="ds" text-anchor="middle">eff_req[i][j] = req[i][j] &amp; ~i_src_bp[i] &amp; ~i_dest_bp[j] &amp; rst_n  （复位期间输出恒 0，无 X 传播）</text>

  <path d="M 420 241 L 420 275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ===================== ITER loop region ===================== -->
  <rect x="30" y="265" width="790" height="250" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="284" class="lbl">ITER 轮迭代 (generate 循环, 纯组合展开, 一拍内完成)</text>
  <text x="44" y="300" class="tiny">每轮只处理"上一轮仍未匹配"的源/目的 (src_avail / dst_avail)</text>

  <!-- Grant stage -->
  <rect x="60" y="312" width="560" height="66" rx="6" fill="#0f172a"/>
  <rect x="60" y="312" width="560" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="336" class="nm" text-anchor="middle">Grant 阶段 (目的侧) — M 个轮询仲裁器</text>
  <text x="340" y="352" class="ds" text-anchor="middle">每个目的按 g_ptr[j] 从请求它的源中选 1 个: mask_hi[k]=(k&gt;=ptr), grant=最低置位</text>
  <text x="340" y="366" class="tiny" text-anchor="middle">lowest_set(x) = x &amp; ~(x-1)    —— 保证每目的至多 1 个 grant (正交)</text>

  <path d="M 340 378 L 340 410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Accept stage -->
  <rect x="60" y="410" width="560" height="66" rx="6" fill="#0f172a"/>
  <rect x="60" y="410" width="560" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="434" class="nm" text-anchor="middle">Accept 阶段 (源侧) — N 个轮询仲裁器</text>
  <text x="340" y="450" class="ds" text-anchor="middle">每个源按 a_ptr[i] 从给它 grant 的目的中选 1 个  —— 保证每源至多 1 个 accept (正交)</text>
  <text x="340" y="464" class="tiny" text-anchor="middle">正交 = 每源至多命中 1 目的 &amp;&amp; 每目的至多命中 1 源</text>

  <path d="M 620 345 L 700 345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 620 443 L 700 443" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Pointer registers (right side) -->
  <rect x="700" y="312" width="220" height="66" rx="6" fill="#0f172a"/>
  <rect x="700" y="312" width="220" height="66" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="810" y="336" class="nm" text-anchor="middle">g_ptr[M·clog2N] 寄存器</text>
  <text x="810" y="352" class="ds" text-anchor="middle">目的侧轮询指针</text>
  <text x="810" y="366" class="tiny" text-anchor="middle">默认异步复位 PTR_RESET=1 (错开对角)</text>

  <rect x="700" y="410" width="220" height="66" rx="6" fill="#0f172a"/>
  <rect x="700" y="410" width="220" height="66" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="810" y="434" class="nm" text-anchor="middle">a_ptr[N·clog2M] 寄存器</text>
  <text x="810" y="450" class="ds" text-anchor="middle">源侧轮询指针</text>
  <text x="810" y="464" class="tiny" text-anchor="middle">posedge 更新, 仅首轮匹配才推进</text>

  <!-- pointer feedback -->
  <path d="M 700 335 L 630 335 L 630 320 L 625 320" stroke="#a78bfa" stroke-width="1.2" fill="none" marker-end="url(#arw-v)"/>
  <path d="M 700 432 L 630 432 L 630 448 L 625 448" stroke="#a78bfa" stroke-width="1.2" fill="none" marker-end="url(#arw-v)"/>

  <!-- pass loop feedback -->
  <path d="M 340 476 L 340 496 L 80 496 L 80 345" stroke="#fb923c" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <text x="96" y="508" fill="#fb923c" class="tiny">下一轮: 仅未匹配源/目的 (ITER&gt;1)</text>

  <!-- ===================== iSLIP final match ===================== -->
  <path d="M 340 476 L 340 530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="40" y="530" width="760" height="54" rx="6" fill="#0f172a"/>
  <rect x="40" y="530" width="760" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="552" class="nm" text-anchor="middle">iSLIP 匹配 = 各轮 accept 取并 (各轮互斥, 直接 OR)</text>
  <text x="420" y="568" class="ds" text-anchor="middle">final_accept[i][j] —— 一拍内、正交、双向公平的 N→M 匹配</text>

  <path d="M 420 584 L 420 606" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ===================== AUGMENT (swap) ===================== -->
  <rect x="40" y="606" width="760" height="86" rx="6" fill="#0f172a"/>
  <rect x="40" y="606" width="760" height="86" rx="6" fill="rgba(120,53,15,0.35)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="420" y="628" class="nm" text-anchor="middle">AUGMENT 增广 / 交换 (AUGMENT=1) — 提升匹配规模</text>
  <text x="420" y="646" class="ds" text-anchor="middle">未匹配源 i 借用已匹配目的 j (其源 k 可重配); k 迁到另一个空闲目的 l —— 长度 3 增广路径</text>
  <text x="420" y="662" class="ds" text-anchor="middle">两段最低索引匹配: A) i → j (releasable)  B) displaced k → 空闲 l；只增不减规模</text>
  <text x="420" y="678" class="tiny" text-anchor="middle">注意: 并行交换可能"移走但未完成替换" —— 因此本阶段不负责极大性, 由下一级填充兜底</text>

  <path d="M 420 692 L 420 714" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ===================== Residual fill ===================== -->
  <rect x="40" y="714" width="760" height="104" rx="6" fill="#0f172a"/>
  <rect x="40" y="714" width="760" height="104" rx="6" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="2"/>
  <text x="420" y="736" class="nm" text-anchor="middle">残余填充 (始终开启) — 极大性硬保证</text>
  <text x="420" y="754" class="ds" text-anchor="middle">free = 未被 iSLIP + swap 匹配的目的; 按源 i = 0..N-1 串行: 若 i 仍空闲, 取一个仍空闲且被 i 请求的目的</text>
  <text x="420" y="770" class="ds" text-anchor="middle">只 ADD 匹配, 从不移动/删除 → 正交性保持, 规模不减; 还顺带修复 swap 的未完成 move</text>
  <text x="420" y="786" class="tiny" text-anchor="middle">极大性证明: 若残留 req(i,j) 且 i、j 都空闲 —— 空闲集只减不增, 轮到 i 时 j 仍空闲, i 必取一个目的, 矛盾</text>
  <text x="420" y="802" class="tiny" text-anchor="middle">结论: 对任意 N/M、任意请求矩阵, 输出都不存在"两端空闲的请求对" (10x10、9x11、N&lt;M、N&gt;M 全部成立)</text>

  <path d="M 420 818 L 420 840" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ===================== Outputs ===================== -->
  <rect x="40" y="840" width="180" height="66" rx="6" fill="#0f172a"/>
  <rect x="40" y="840" width="180" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="864" class="nm" text-anchor="middle">o_grant_rand_vld</text>
  <text x="130" y="880" class="ds" text-anchor="middle">[N][M] 最终命中矩阵</text>
  <text x="130" y="894" class="tiny" text-anchor="middle">(正交 + 极大)</text>

  <rect x="240" y="840" width="180" height="66" rx="6" fill="#0f172a"/>
  <rect x="240" y="840" width="180" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="864" class="nm" text-anchor="middle">o_grant_src_vld/ptr</text>
  <text x="330" y="880" class="ds" text-anchor="middle">[N] 源命中 + 目的号</text>
  <text x="330" y="894" class="tiny" text-anchor="middle">ptr = [clog2(M)]</text>

  <rect x="440" y="840" width="180" height="66" rx="6" fill="#0f172a"/>
  <rect x="440" y="840" width="180" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="864" class="nm" text-anchor="middle">o_grant_dest_vld/ptr</text>
  <text x="530" y="880" class="ds" text-anchor="middle">[M] 目的命中 + 源号</text>
  <text x="530" y="894" class="tiny" text-anchor="middle">ptr = [clog2(N)]</text>

  <!-- legend -->
  <rect x="40" y="936" width="860" height="164" rx="10" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="60" y="960" class="lbl">关键要点</text>
  <text x="60" y="982" class="ds">1. 一拍出结果: grant/accept/swap/fill 全组合, 唯一时序元件是指针寄存器 → 零延迟。</text>
  <text x="60" y="1000" class="ds">2. 双向公平: 源侧 a_ptr 轮询目的, 目的侧 g_ptr 轮询源; 指针只在"真正匹配"的首轮推进 → 乱序最小。</text>
  <text x="60" y="1018" class="ds">3. 性能: ITER=4 默认; AUGMENT=1 交换把随机流量匹配规模提升到 ~96-99.5% (of min(N,M))。</text>
  <text x="60" y="1036" class="ds">4. 硬保证: 残余填充只增不删, 对任意 N/M 消除"两端空闲却未调度"的请求对 (即极大匹配)。</text>
  <text x="60" y="1054" class="ds">5. 取舍: AUGMENT=1 内部固定最低索引优先, 放松 RR 公平性换取规模; AUGMENT=0 严格公平且仍极大。</text>
  <text x="60" y="1072" class="ds">6. 编码风格: 每 always 只赋值 1 个指针切片; 指针默认异步复位; RTL 全 ASCII; 核心用算术最低置位。</text>
  <text x="60" y="1090" class="ds">7. 反压/复位: i_src_bp / i_dest_bp 组合门控; rst_n 门控输出为 0, 复位期间无 X。</text>
</svg>
